<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Board</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="base-board-header">
      <h1 class="base-board-header__title">Base Board</h1>
      <div class="base-board-header__actions">
        <button id="btn-open-folder" class="base-board-button">Open Folder</button>
      </div>
    </header>

    <!-- Board Container -->
    <main id="board-container" class="base-board-container">
      <div class="base-board-empty-state">
        <p>Select a folder containing a .base file to get started.</p>
      </div>
    </main>
  </div>

  <script src="./main.js"></script>
</body>
</html>
